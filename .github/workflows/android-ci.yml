name: Android CI

on:
  push:
    branches: [main]
    paths-ignore: ['relay/**', 'docs/**', 'deploy/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Debounce
        run: sleep 60
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo (relay integration-test binary)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay
      - name: Build relay binary (for :core:tunnel:integrationTest)
        working-directory: relay
        # `--features test-mode` compiles in the test-admin surface used by
        # the `:core:tunnel:integrationTest` fixture (issue #249). The feature
        # is compile-time excluded from release builds (deploy workflow runs
        # `cargo build --release` WITHOUT this flag).
        run: cargo build --features test-mode
      - name: Generate debug keystore
        run: |
          mkdir -p .signing
          keytool -genkeypair -v \
            -keystore .signing/debug.keystore \
            -storepass rousecontext -keypass rousecontext \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias debug \
            -dname "CN=Debug,O=Debug,L=Debug,S=Debug,C=US"
      - name: Lint
        # Distribution is a build flag, not a flavor (#467), so a single
        # ktlintCheck only sees the selected (FOSS, default) `src` dir. Run a
        # second pass with `-Pgoogle` so the Firebase distribution sources are
        # linted too. (`:app` is the only module whose sources vary by flag.)
        run: |
          ./gradlew ktlintCheck
          ./gradlew :app:ktlintCheck -Pgoogle
      - name: Check for zombie screen files
        run: bash scripts/check-zombie-screens.sh
      - name: Check for manual-template JSON in production code
        # Per #426: prevents reintroduction of the #417 bug class where
        # """{"field":"$value"}""" string templates produce malformed JSON
        # when interpolated values contain quotes, backslashes, or control
        # characters. Production code must use @Serializable + encodeToString.
        run: bash scripts/check-no-manual-json.sh
      # A green gate is not evidence the gate works: #594 was a path allowlist,
      # applied unanchored to grep's `file:line:content` output, that swallowed
      # any violation merely mentioning the exempt file. This runs the gate
      # against a throwaway repo and asserts the red cases actually go red.
      - name: "Manual-JSON gate self-test (issue #594)"
        run: bash scripts/tests/check-no-manual-json-test.sh
      # Same reasoning applied to #628's positive control. That control compares
      # a count of goldens on disk against Roborazzi's own tally, and an
      # equality check has a vacuous solution: zero == zero passes. The first
      # draft went green with the goldens deleted. Runs here — no JDK, under a
      # second, long before the build — so a regression in the control reports
      # in seconds rather than surviving because the thing it guards happened to
      # be healthy that day (#597).
      - name: "Roborazzi coverage-control self-test (issue #628)"
        run: bash scripts/tests/check-roborazzi-coverage-test.sh
      # Both distributions write the SAME `app/build/outputs/apk/debug/` path
      # (distribution is a flag, not a flavor — #467), so each build is verified
      # immediately after it runs, before the next one overwrites it.
      - name: Build (Google distribution)
        run: ./gradlew :app:assembleDebug -Pgoogle
      - name: "Google APK really contains Firebase (issue #548)"
        # The inverse of the purity gate, and not decoration: it is the live
        # positive control. The FOSS check below can only be trusted if these
        # patterns still match real Firebase code, and this proves they do on
        # every run — so the gate cannot rot into one that matches nothing and
        # passes everything (#579).
        run: bash scripts/check-apk-distribution.sh --apk app/build/outputs/apk/debug/app-debug.apk --expect google
      - name: Build (FOSS distribution, Firebase-free)
        # Bare build (no `-Pgoogle`) is the FOSS distribution: it skips the
        # Firebase Gradle plugins and proves it assembles without
        # google-services. See #467.
        run: ./gradlew :app:assembleDebug
      - name: "FOSS APK contains no Google/Firebase code (issue #548)"
        # Reads the artifact, not the build config: whatever flips the gate — a
        # stray -P flag, a gradle.properties line, an ambient
        # ORG_GRADLE_PROJECT_google — lands in the DEX and is caught here.
        # `android-ci.yml` builds both distributions too (#585); without these
        # the gate would live only in `ci.yml`, and deleting that job as a
        # "duplicate build" would silently take the purity check with it.
        run: bash scripts/check-apk-distribution.sh --apk app/build/outputs/apk/debug/app-debug.apk --expect foss
      - name: Unit tests
        timeout-minutes: 20
        # Distribution is a build flag (#467), so `:app` unit tests run twice:
        # bare = FOSS (ACRA / keypair seams), `-Pgoogle` = Firebase-backed. The
        # library modules are distribution-agnostic and run once.
        run: |
          ./gradlew \
            :core:tunnel:jvmTest \
            :core:mcp:jvmTest \
            :core:bridge:jvmTest \
            :api:testDebugUnitTest \
            :notifications:testDebugUnitTest \
            :work:testDebugUnitTest \
            :integrations:testDebugUnitTest \
            :app:testDebugUnitTest
          ./gradlew :app:testDebugUnitTest -Pgoogle
      - name: Integration tests (relay)
        if: success() || failure()
        # Raised from 10 → 15 as the integration-scenario coverage grew
        # through #247's batches. Both :core:tunnel:integrationTest and
        # :app:integrationTest launch the real relay subprocess (Rust TLS
        # handshake + Robolectric Android runtime), so each scenario costs
        # several real seconds; the 10-min cap started truncating CI at
        # ~120 tests (see the #285/#287 CI failures).
        # Three serial integration suites (:core:tunnel + :app FOSS + :app
        # Google) share the relay binary; 15 min was sized for two, and adding
        # the second :app suite (#469) pushed the step over — bumped to 30.
        timeout-minutes: 30
        # `:app:integrationTest` boots the real AppModule Koin graph against the
        # same `--test-mode` relay used by `:core:tunnel:integrationTest` (issue
        # #250 scaffold; umbrella #247). With distribution as a build flag (#467)
        # it runs once bare — FOSS, so the keypair device-identity round trip
        # (register → provision → renew, zero Firebase) is covered (#469, part of
        # #460) — and once with `-Pgoogle` for the Firebase-backed path. The
        # FOSS pass (with :core:tunnel) runs first, then the Google pass; both
        # reuse the relay binary built above. The Google pass runs last so the
        # `koverHtmlReport` step (also `-Pgoogle`) reuses its results UP-TO-DATE.
        run: |
          ./gradlew :core:tunnel:integrationTest :app:integrationTest
          ./gradlew :app:integrationTest -Pgoogle
      - name: Coverage report (Kover)
        # Runs after unit + integration tests. Kover would also trigger tests
        # on its own, but the preceding steps already ran them — Gradle will
        # reuse those results via `UP-TO-DATE`, so this step just aggregates.
        # `-Pgoogle` so the `:app` coverage tracks the shipping Firebase
        # distribution (matching the pre-#467 google-flavor-only coverage); its
        # Google unit + integration runs above are reused UP-TO-DATE.
        if: success() || failure()
        timeout-minutes: 10
        run: ./gradlew koverHtmlReport koverXmlReport -Pgoogle
      - name: Per-module coverage summary
        if: success() || failure()
        run: |
          set -euo pipefail
          {
            echo "## Coverage (line %)"
            echo
            echo "| Module | Covered | Missed | Line % |"
            echo "|---|---:|---:|---:|"
            modules=(api core/tunnel core/mcp core/bridge notifications work integrations app)
            total_cov=0
            total_mis=0
            for m in "${modules[@]}"; do
              f="$m/build/reports/kover/report.xml"
              if [ ! -f "$f" ]; then
                echo "| \`:$m\` | — | — | (no report) |"
                continue
              fi
              # The last LINE counter in a Kover XML is the module total.
              line=$(grep -E '<counter type="LINE"' "$f" | tail -1)
              cov=$(echo "$line" | sed -n 's/.*covered="\([0-9]*\)".*/\1/p')
              mis=$(echo "$line" | sed -n 's/.*missed="\([0-9]*\)".*/\1/p')
              cov=${cov:-0}
              mis=${mis:-0}
              tot=$((cov + mis))
              if [ "$tot" -eq 0 ]; then
                pct="—"
              else
                pct=$(awk "BEGIN { printf \"%.1f%%\", ($cov * 100) / $tot }")
              fi
              echo "| \`:${m//\//:}\` | $cov | $mis | $pct |"
              total_cov=$((total_cov + cov))
              total_mis=$((total_mis + mis))
            done
            grand_tot=$((total_cov + total_mis))
            if [ "$grand_tot" -gt 0 ]; then
              grand_pct=$(awk "BEGIN { printf \"%.1f%%\", ($total_cov * 100) / $grand_tot }")
            else
              grand_pct="—"
            fi
            echo "| **Total** | **$total_cov** | **$total_mis** | **$grand_pct** |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage HTML
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: build/reports/kover/html/
      - name: Upload test reports
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
      # Screenshot verification runs LAST, and that placement is load-bearing
      # (issue #628).
      #
      # Until now no workflow ran any Roborazzi task at all: `testDebugUnitTest`
      # executes the screenshot tests in Roborazzi's DEFAULT mode, which renders
      # each composable and passes without ever comparing it to the committed
      # PNG. #490 and #508 both shipped stale goldens fully green that way, for
      # ~2 and ~9 weeks, and the drift surfaced only because an unrelated PR
      # (#610) happened to run a record task. `verifyRoborazziDebug` is the mode
      # that actually compares.
      #
      # Why last, rather than next to the "Unit tests" step it belongs beside:
      #
      #   * Verify mode is a task INPUT, not a flag on the side. Measured: a
      #     plain `:app:testDebugUnitTest` immediately after a verify run
      #     re-EXECUTES (4 executed, 111 up-to-date) rather than reporting
      #     UP-TO-DATE, and vice versa. So a verify step placed anywhere above
      #     "Coverage report (Kover)" would leave `:app:testDebugUnitTest` out of
      #     date for Kover's `-Pgoogle` pass, falsifying that step's documented
      #     "Gradle will reuse those results via UP-TO-DATE" and adding a full
      #     ~1.5-min suite re-run inside its 10-minute cap. Below the Kover step,
      #     the inputs Kover sees are byte-identical to before this change.
      #
      #   * The verify run re-runs `:app`'s whole unit suite and OVERWRITES
      #     `app/build/reports/tests/`. Above "Upload test reports" it would
      #     clobber a failing `-Pgoogle` run's report with its own — producing
      #     precisely #626's artifact-that-omits-the-failure. Below it, the
      #     uploaded reports are already collected.
      #
      # `:notifications` carries 40 goldens of its own and had the identical
      # hole, so it is verified in the same invocation. `--continue` so a
      # mismatch in one module still reports the other's, instead of the first
      # failure masking the rest.
      - name: "Screenshot goldens match the committed PNGs (issue #628)"
        id: roborazzi
        if: success() || failure()
        timeout-minutes: 20
        # Bare (FOSS) distribution: the screenshot tests live in the shared
        # `src/test` tree and the goldens are recorded with a bare
        # `./gradlew :app:recordRoborazziDebug`, so this compares like for like.
        run: ./gradlew :app:verifyRoborazziDebug :notifications:verifyRoborazziDebug --continue
      # A green verify is NOT evidence that verification happened: Roborazzi
      # prints BUILD SUCCESSFUL both when it compared 129 goldens and found no
      # drift and when it compared zero. That second state is the one CI was
      # already in, and the same rot #579/#594 describe for the grep gates. This
      # reads the tally Roborazzi writes and asserts it equals the number of
      # golden PNGs actually committed, so the gate cannot quietly stop covering
      # them. Runs even when the verify above went red — the tally is written
      # either way, and a mismatch changes what the red X means.
      - name: "Roborazzi really compared every committed golden (issue #628)"
        id: roborazzi_coverage
        if: success() || failure()
        run: bash scripts/check-roborazzi-coverage.sh
      # `outputs/roborazzi/` is where Roborazzi writes `<name>_actual.png` and
      # `<name>_compare.png` on a mismatch, and it is EMPTY on a clean run —
      # confirmed by running the verify task against a deliberately perturbed
      # golden and listing the tree. `reports/roborazzi/` holds the HTML index,
      # whose <img> tags point at `../../../outputs/roborazzi/<name>_compare.png`
      # — a repo-relative link, so both trees must be uploaded together and with
      # their paths intact or the report renders as broken images. Uploading
      # them as sibling paths makes upload-artifact root the archive at their
      # common ancestor, which preserves that link. `test-results/roborazzi/`
      # carries the JSON tallies the step above asserts on.
      #
      # `if-no-files-found: error` is deliberate: the HTML index is written on
      # every verify run that reaches the comparison, so an empty artifact here
      # means the paths have moved — the failure mode where an artifact is named
      # for exactly the thing it omits (#626).
      - name: Upload Roborazzi comparison images
        if: failure() && (steps.roborazzi.outcome == 'failure' || steps.roborazzi_coverage.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-screenshot-diffs
          if-no-files-found: error
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/roborazzi/
            app/build/test-results/roborazzi/
            notifications/build/outputs/roborazzi/
            notifications/build/reports/roborazzi/
            notifications/build/test-results/roborazzi/
