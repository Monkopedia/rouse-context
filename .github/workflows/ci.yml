name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Debounce
        run: sleep 60
      - uses: actions/checkout@v4
      # shellcheck is INSTALLED at a pinned version rather than taken from the
      # runner image. The runner does ship one (this step prints which, so the
      # claim stays checkable), but `ubuntu-latest` is a moving alias that rolls
      # to a new image on GitHub's schedule, not ours -- and a shellcheck
      # release that DROPS or relaxes a check would weaken the gate below with
      # no signal at all. The checksum makes it a pin and not just a download.
      #
      # Bump in lockstep with EXPECTED_SHELLCHECK_VERSION in
      # scripts/check-shell-lint.sh, which asserts the two agree; that assertion
      # is what makes deleting this step fail loudly instead of quietly handing
      # the gate back to whatever the image happens to carry.
      - name: Install shellcheck (pinned)
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          # Assigned with an explicit failure branch rather than substituted
          # into the echo. This line is a DIAGNOSTIC printed before the pinned
          # install, so that the "the runner already ships one" claim above
          # stays checkable -- which means a runner with no shellcheck at all
          # must reach the install below, not die here. The `|| runner_sc=''`
          # is what guarantees that, and unlike an in-substitution `|| echo` it
          # also satisfies SC2312, which accepts only the literal `|| true` /
          # `||:` forms (measured).
          runner_sc=$(shellcheck --version 2>/dev/null |
            sed -n 's/^version: /shellcheck /p') || runner_sc=""
          echo "runner image ships: ${runner_sc:-no shellcheck}"
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/shellcheck.tar.xz "$url"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      # actionlint is what reaches the OTHER half of this repo's shell: the
      # shell living inline in `run:` blocks across these seven workflow files
      # -- 71 blocks, 383 lines as this landed, 70/372 of them before this very
      # step was added -- which the *.sh gate below cannot see (#659). It
      # shells out to the
      # shellcheck installed above rather than carrying its own, so the two pins
      # describe one linter, not two.
      #
      # Pinned by checksum for the reason above AND a sharper one: actionlint's
      # shellcheck integration is silent when it is missing -- no warning, no
      # non-zero exit, just a clean report. `scripts/check-shell-lint.sh` runs a
      # known-bad control workflow on every invocation to catch exactly that,
      # but a pinned, verified binary is what stops the situation arising.
      #
      # Bump in lockstep with EXPECTED_ACTIONLINT_VERSION in
      # scripts/check-shell-lint.sh, which asserts the two agree.
      - name: Install actionlint (pinned)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/actionlint.tar.gz "$url"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version
      # The gates below ARE shell scripts, and so are their self-tests, so this
      # runs first: if one of them is malformed, the reason lands here instead
      # of as a confusing failure inside the gate itself (#592).
      #
      # Two phases in one step: the tracked *.sh files (#592) and the inline
      # `run:` shell in these workflow files (#659). One step because they are
      # one question -- "is the shell this repo owns linted" -- and splitting
      # them would make it possible to drop one and still see a green tick next
      # to the other.
      - name: "Shell passes shellcheck, in scripts and in workflows (#592, #659)"
        run: bash scripts/check-shell-lint.sh
      # Grep gates run before the JDK/Gradle setup: they need nothing but the
      # checkout and finish in under a second, so a violation reports in seconds
      # instead of after a multi-minute ktlint/detekt pass.
      #
      # Both take their path list from scripts/production-source-dirs.sh. They
      # used to carry a hand-maintained list each; the lists drifted and the
      # runBlocking one silently stopped covering integrations/ (#547). Keep the
      # list derived, in one place.
      - name: "Production source trees are resolvable (issue #547)"
        run: bash scripts/production-source-dirs.sh
      - name: "Block production runBlocking (issue #136)"
        run: bash scripts/check-no-production-runblocking.sh
      - name: "Block sensitive production log sites (issue #379)"
        run: bash scripts/check-no-sensitive-logging.sh
      # A green gate is not evidence the gate works: #577 and #590 were the same
      # post-filter, in both gates, silently swallowing real violations while
      # reporting clean. These tests run each gate against a throwaway repo and
      # assert the red cases actually go red.
      - name: "Sensitive-logging gate self-test (issue #577)"
        run: bash scripts/tests/check-no-sensitive-logging-test.sh
      - name: "runBlocking gate self-test (issue #590)"
        run: bash scripts/tests/check-no-production-runblocking-test.sh
      # The anchors those two post-filters share now live in one library (#597),
      # which makes a mistake in them three gates' worth of expensive. Asserts
      # both directions for both filters -- the line that must be dropped AND
      # the line that must survive -- since a filter that drops everything and
      # one that drops nothing are both green if only one side is tested.
      - name: "Gate post-filter library tests (issue #597)"
        run: bash scripts/tests/gate-filters-test.sh
      # A linter wrapper is the easiest gate of all to make vacuous: hand
      # `shellcheck` an empty file list and it reads stdin, prints nothing and
      # exits 0 -- identical output to a clean tree. actionlint is worse, and
      # measurably so: with no shellcheck on PATH it lints every workflow,
      # reports nothing and exits 0. This asserts both discoveries go RED on an
      # empty set, that real violations are named by file/workflow, job and rule
      # code, and that a dead shellcheck integration is noticed rather than
      # reported as clean.
      - name: "shell-lint gate self-test (#592, #659)"
        run: bash scripts/tests/check-shell-lint-test.sh
      # Not a gate, but the highest-consequence shell in the repo: it writes the
      # production relay secrets, and its exit status is the operator's only
      # signal that all six landed. A partial run used to exit 0 (#686). The
      # test stubs `gh` and `gcloud`, so it never reaches GitHub or the VPS.
      - name: "backfill-relay-secrets self-test (#686)"
        run: bash scripts/tests/backfill-relay-secrets-test.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate debug keystore
        run: |
          mkdir -p .signing
          keytool -genkeypair -v \
            -keystore .signing/debug.keystore \
            -storepass rousecontext -keypass rousecontext \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias debug \
            -dname "CN=Debug,O=Debug,L=Debug,S=Debug,C=US"
      - name: ktlint
        # Distribution is a build flag, not a flavor (#467): a single ktlintCheck
        # only lints the selected (FOSS, default) `src` dir, so a second
        # `-Pgoogle` pass lints the Firebase distribution sources (`:app` only).
        run: |
          ./gradlew ktlintCheck
          ./gradlew :app:ktlintCheck -Pgoogle
      - name: detekt
        # detekt's source set is the raw `src` glob across modules, so it already
        # scans both the FOSS and Google distribution dirs in one pass (#467).
        run: ./gradlew detekt

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Debounce
        run: sleep 60
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate debug keystore
        run: |
          mkdir -p .signing
          keytool -genkeypair -v \
            -keystore .signing/debug.keystore \
            -storepass rousecontext -keypass rousecontext \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias debug \
            -dname "CN=Debug,O=Debug,L=Debug,S=Debug,C=US"
      # Both distributions write the SAME `app/build/outputs/apk/debug/` path
      # (distribution is a flag, not a flavor — #467), so each build is verified
      # immediately after it runs, before the next one overwrites it.
      - name: Build (Google distribution)
        run: ./gradlew :app:assembleDebug -Pgoogle
      - name: "Google APK really contains Firebase (issue #548)"
        # The inverse of the purity gate, and not decoration: it is the live
        # positive control. The FOSS check below can only be trusted if these
        # patterns still match real Firebase code, and this proves they do on
        # every run — so the gate cannot rot into one that matches nothing and
        # passes everything (#579).
        run: bash scripts/check-apk-distribution.sh --apk app/build/outputs/apk/debug/app-debug.apk --expect google
      - name: Build (FOSS distribution, Firebase-free)
        # Bare build (no `-Pgoogle`) is the FOSS distribution: it skips the
        # Firebase Gradle plugins and proves it assembles without
        # google-services. See #467.
        run: ./gradlew :app:assembleDebug
      - name: "FOSS APK contains no Google/Firebase code (issue #548)"
        # Reads the artifact, not the build config: whatever flips the gate — a
        # stray -P flag, a gradle.properties line, an ambient
        # ORG_GRADLE_PROJECT_google — lands in the DEX and is caught here.
        run: bash scripts/check-apk-distribution.sh --apk app/build/outputs/apk/debug/app-debug.apk --expect foss
      - name: Unit tests
        id: unit_tests
        # Distribution is a build flag (#467): `:app` unit tests run once bare
        # (FOSS) and once with `-Pgoogle` (Firebase). `testDebugUnitTest`
        # (unqualified) covers the library modules' `:app` foss run plus the
        # distribution-agnostic modules; the `-Pgoogle` pass covers the Firebase
        # distribution.
        #
        # These runs do NOT verify the Roborazzi screenshot goldens: in its
        # default mode Roborazzi renders each composable and passes without
        # comparing it to the committed PNG (#628). `verifyRoborazziDebug` is
        # the mode that compares, and it lives in `android-ci.yml`'s `test` job
        # — deliberately in ONE job only. It re-runs the whole `:app` suite, so
        # a second copy here would double that cost and, worse, make any flake
        # look like a real golden mismatch half the time. Add it here only if it
        # is being REMOVED from `android-ci.yml`.
        run: |
          ./gradlew testDebugUnitTest :core:tunnel:jvmTest :core:mcp:jvmTest :core:bridge:jvmTest
          ./gradlew :app:testDebugUnitTest -Pgoogle
      - name: Compile device/e2e test sources (issue #549)
        # `:device-tests` and `:e2e` are in settings.gradle.kts but no workflow
        # referenced them, and nothing else compiled them: every other Gradle
        # invocation here is scoped to `:app` or `:core:*`, ktlint parses
        # without typechecking, and detekt runs without a classpath (no type
        # resolution). So a compile error in either module left CI fully green.
        #
        # They are NOT run: both require a physically attached Android device
        # (adb + a device serial), which no hosted runner has. Compiling them
        # is what converts "never looked at" into "known to build" — the gap
        # #549 describes — and it costs seconds.
        run: ./gradlew :device-tests:compileTestKotlin :e2e:compileTestKotlin
      # Same gap as android-ci.yml had (#631): this collected only the HTML
      # reports, so a failure's assertion message — which Gradle writes to
      # `build/test-results/**/TEST-*.xml`, and only there in machine-readable
      # form — was discarded with the runner.
      #
      # Both uploads are scoped to the "Unit tests" step having actually run.
      # That scoping is real HERE and would be a no-op in android-ci.yml: this
      # job's "Unit tests" step carries no `if:`, so an earlier failure --
      # `assembleDebug`, or either APK-distribution gate, none of which produce
      # test output -- skips it, and under `if-no-files-found: error` a bare
      # `failure()` would bolt a spurious "no files found" error onto every such
      # run. In android-ci.yml the test steps run unconditionally, so the same
      # condition there would always be true; it is omitted rather than faked.
      - name: Upload test reports (HTML)
        if: failure() && steps.unit_tests.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          if-no-files-found: error
          path: "**/build/reports/tests/"
      # Uploaded on green runs too, unlike the HTML. The XML is a few hundred KB
      # and it is the only record of WHICH tests executed: `BUILD SUCCESSFUL`
      # prints identically for a full suite and for zero tests, so counting
      # `<testcase>` elements in this artifact is what tells those two apart
      # after the fact.
      #
      # Read that count per suite directory, not as a repo total. `:app`'s two
      # distribution passes now write SEPARATE trees (#640) --
      # `test-results/testDebugUnitTest/foss/` (76 files / 623 tests) and
      # `.../google/` (73 files / 614 tests) -- so both reach this upload.
      # Before that they shared one directory that Gradle clears per run, and
      # this workflow's green run 33228348112 carried the `-Pgoogle` pass only:
      # 73 files / 614 tests, NOT the 623 a bare `:app:testDebugUnitTest`
      # produces. The two counts differ legitimately -- each distribution
      # compiles its own `src/test{Foss,Google}` sources.
      #
      # Separate step and separate artifact name on purpose: `if-no-files-found`
      # is evaluated over a step's whole match set, so folding both paths into
      # one step would let the HTML satisfy the check while the XML path
      # silently matched nothing. And upload-artifact@v4 documents that artifact
      # names must be unique — with the default `overwrite: false` a second
      # upload under the same name fails the step — so the names must differ.
      #
      # `if-no-files-found: error` rather than the default `warn`: `warn` leaves
      # an annotation and a GREEN step, so an empty artifact looks exactly like
      # a working one.
      - name: Upload test results (XML)
        if: (success() || failure()) && steps.unit_tests.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xml
          if-no-files-found: error
          path: "**/build/test-results/**/*.xml"
