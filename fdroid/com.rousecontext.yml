Builds:
  - versionName: 1.0.9
    versionCode: 10
    # Build from the signed release tag. `v1.0.8` does not exist yet; it is
    # created when the owner cuts the release. Until then this is a template.
    #
    # IMPORTANT — when copying this to fdroiddata, pin `commit:` to the IMMUTABLE
    # release SHA, NOT the tag:
    #     git rev-parse v1.0.8^{commit}
    # and put that full 40-char SHA here. This matches the proven
    # com.monkopedia.healthdisconnect recipe, whose published Builds entry pins a
    # full commit SHA rather than a movable tag ref. A SHA can't be retargeted
    # after submission, so the from-source build is locked to exactly the bytes
    # F-Droid reviewed.
    commit: v1.0.9
    subdir: app
    # Remove the Google-only Gradle config BEFORE F-Droid scans/builds. All
    # Firebase / Google-services build coordinates (the two Gradle plugins, the
    # Crashlytics config, and the firebase-* dependencies) live exclusively in
    # gradle/google-services.gradle.kts, which the app build applies ONLY under
    # `-Pgoogle`. The bare FOSS build (what F-Droid runs) never applies it, so
    # deleting it here is safe and leaves ZERO Firebase coordinates for the
    # source scanner to see — no `scanignore` needed (the F-Droid maintainer
    # asked us to remove the non-FOSS deps in prebuild rather than allow-list
    # them). See app/build.gradle.kts (`if (googleBuild) { apply(from = ...) }`).
    #
    # prebuild runs in the `subdir` (app/), so paths are relative to it: `../`
    # reaches the repo root. The root build.gradle.kts still declares the two
    # Google/Firebase plugins `apply false` (so the extracted script can apply
    # them under -Pgoogle); the sed strips those declarations too, since the FOSS
    # build never applies them. Verified: `fdroid build` scanner-clean + the
    # from-source build reproduces the published FOSS asset byte-for-byte.
    prebuild:
      - rm -f ../gradle/google-services.gradle.kts
      - sed -i -e '/libs.plugins.google.services/d' -e '/libs.plugins.firebase.crashlytics/d' ../build.gradle.kts
    # No flavor: the bare build is FOSS. The FOSS/Google split is a `-Pgoogle`
    # project property, not a product flavor, so the default `assembleRelease`
    # (which `gradle: [yes]` invokes) is exactly the FOSS variant. The no-flavor
    # `gradle: [yes]` (plain assembleRelease) verifies identically to a named
    # flavor: F-Droid's reproducibility check strips the signatures from BOTH the
    # from-source build and the Binaries APK and byte-diffs the results — it is
    # task-agnostic, so a bare assembleRelease and a flavored assembleFooRelease
    # are checked the same way.
    gradle:
      - yes
    # No signing setup needed. With no keystore/passwords present (a clean
    # F-Droid checkout has neither — both are gitignored), the release
    # signingConfig is left off the buildType and AGP builds the release
    # UNSIGNED. F-Droid verifies that unsigned APK reproduces the published
    # upstream-signed asset (see Binaries:) and ships our signature. No throwaway
    # keystore, no prebuild — mirrors com.monkopedia.healthdisconnect's
    # F-Droid recipe, which is LIVE on F-Droid (v1.1.1) via this exact
    # reproducible-Binaries + AllowedAPKSigningKeys path. The approach is
    # therefore proven in production, not speculative.
    #
    # The load-bearing reproducibility pins (do NOT remove) live in
    # app/build.gradle.kts:
    #     dependenciesInfo { includeInApk = false; includeInBundle = false }
    #     release { vcsInfo.include = false }
    # Without these the APK embeds the AGP dependency-metadata block and a VCS
    # commit stamp, both non-reproducible, and the byte-diff fails.
    #
    # ONE RISK TO CALL OUT: the FOSS asset published to the GitHub Release MUST be
    # built with plain `assembleRelease` and NO stray `-P` flag. fdroidserver
    # runs a bare `assembleRelease`; any extra `-P...` on the upstream side
    # (e.g. `-Pdomain=...`) would change buildConfig bytes and diverge from the
    # F-Droid from-source build. release.yml already builds the FOSS asset bare
    # (no `-Pgoogle`, no `-Pdomain`), so this is satisfied today.
    #
    # The `-Pgoogle` half of that risk is now ENFORCED rather than merely noted:
    # release.yml runs `scripts/check-apk-distribution.sh --expect foss` on the
    # staged `…-foss.apk` and fails the release if any com.google.firebase /
    # com.google.android.gms marker is present, whatever set the flag (issue
    # #548). A stray `-Pdomain=` is still only a convention — it changes
    # buildConfig bytes without adding Google code, so the purity gate cannot
    # see it and the reproducibility compare is what would catch it.
    #
    # The only non-FOSS coordinates in the tree are the Firebase plugins/deps in
    # gradle/google-services.gradle.kts, which `prebuild:` deletes above before
    # the scanner runs. Everything else the scanner might flag is the standard
    # gradle/wrapper/gradle-wrapper.jar, which F-Droid allow-lists. No
    # `scanignore` / `scandelete` is used — the maintainer asked us to remove the
    # non-FOSS deps in prebuild instead of allow-listing them.

MaintainerNotes: |-
    Recipe staged inside the upstream repo (fdroid/com.rousecontext.yml); the
    submitted copy lives in fdroiddata!42096.

    This MaintainerNotes block is LOCAL DOCUMENTATION ONLY — strip it when
    syncing to fdroiddata. The maintainer (linsui) asked for the submitted
    recipe's MaintainerNotes to be removed once the prebuild change made the
    scanignore justification moot, so the fdroiddata copy carries no such
    field. Keep the reasoning here so it isn't lost.

    Reproducible-builds path (PROVEN IN PRODUCTION):
      * This is the same path com.monkopedia.healthdisconnect ships on today —
        it is LIVE on F-Droid (v1.1.1) via the exact reproducible-Binaries +
        AllowedAPKSigningKeys setup. Not speculative.
      * The FOSS release build matches the published GitHub Release APK
        byte-for-byte apart from the v2/v3 APK Signing Block PSS salt, which
        apksigcopier normalizes. F-Droid ships the upstream signature.
      * AllowedAPKSigningKeys is the SHA-256 of the certificate that CI signs
        published releases with (GitHub Actions `secrets.RELEASE_KEYSTORE`, NOT
        the local `.signing/release.keystore`). Confirmed against the published
        v1.0.4 FOSS APK (`rouse-context-1.0.4-foss.apk`) via
        `apksigner verify --print-certs`.
      * With no signing credentials present, AGP builds the release UNSIGNED
        (the release signingConfig is left off the buildType); F-Droid verifies
        reproducibility against the published signed asset and ships our
        signature. No throwaway keystore is needed.
      * Load-bearing reproducibility pins in app/build.gradle.kts (do NOT
        regress): dependenciesInfo{includeInApk=false; includeInBundle=false}
        and release{vcsInfo.include=false}. The published FOSS asset must also
        be built with a bare assembleRelease (no stray -P flags) so it matches
        fdroidserver's bare build; release.yml already does this.

    Firebase-free FOSS build (extract + prebuild-remove, NOT scanignore):
      * ALL Firebase / Google-services build config — the google-services and
        firebase-crashlytics Gradle plugins, the Crashlytics per-build-type
        setup, and the firebase-* runtime dependencies — is extracted into
        gradle/google-services.gradle.kts. app/build.gradle.kts applies that file
        ONLY under `-Pgoogle` (`if (googleBuild) { apply(from = ...) }`). The
        bare FOSS build never applies it, so it compiles ZERO Firebase: no
        plugins on the classpath, no firebase-* deps, no Crashlytics config, and
        google-services.json is not required to assemble it.
      * Because almost every non-FOSS coordinate lives in that one extracted
        file, the recipe's `prebuild` deletes it (`rm -f
        ../gradle/google-services.gradle.kts`, relative to the app subdir) and
        also seds the two `apply false` Google/Firebase plugin declarations out
        of the root build.gradle.kts, before F-Droid's source scanner runs,
        leaving nothing for the scanner to flag. This replaces the earlier
        scanignore-free-but-inline approach: the
        maintainer asked us to remove the non-FOSS deps in prebuild rather than
        allow-list them, and this does exactly that with no `scanignore` /
        `scandelete`.
      * Verified: `aapt2 dump strings` on the FOSS app-release APK shows no
        firebase/gms strings, and the DEX contains no com.google.firebase /
        com.google.android.gms classes. (The wire field name `firebaseToken` and
        UnifiedPush's own org.unifiedpush...FirebaseReceiver are distribution-
        agnostic / FOSS and unrelated to Google Firebase.)
      * The extracted file lives in the repo-root gradle/ dir (not app/) so that
        Android Lint's build-script visitor (lintVitalRelease, which the FOSS
        release build runs) does not try to FIR-resolve a standalone
        apply(from=...) script inside an Android module and crash. The root
        project has no Android lint task.

    Variant facts (do not regress):
      * Bare build = FOSS (UnifiedPush + ACRA, no Firebase/GMS). `-Pgoogle` is
        the Firebase build and must NOT be used for F-Droid.
      * Toolchain at v1.0.8: AGP 8.13.2, Kotlin 2.2.21, JDK 21, compileSdk 36,
        minSdk 24, targetSdk 35, Gradle 8.14.3.
      * FOSS-only runtime deps: UnifiedPush connector 2.5.0, ACRA 5.13.1.

    On bump: update versionName/versionCode here and in CurrentVersion(Code)
    from app/build.gradle.kts, and add a new Builds entry pinned to the new tag.

